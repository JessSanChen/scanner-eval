# Model prices in USD per million tokens, used for cost curves.
# Update when prices change; committed so cost results are reproducible.
#
# Sources, retrieved 2026-09-28:
#   anthropic/*  : Anthropic API pricing (cache write = 1.25x input for the
#                  5-minute TTL, cache read = 0.1x input)
#   openrouter/* : https://openrouter.ai/api/v1/models "pricing" field
#                  (base tier; long-context overrides above 272k prompt
#                  tokens don't apply to our prompt sizes)
anthropic/claude-opus-5:     {input: 5.00, output: 25.00, cache_write: 6.25,   cache_read: 0.50}
anthropic/claude-haiku-4-5:  {input: 1.00, output: 5.00,  cache_write: 1.25,   cache_read: 0.10}
openrouter/openai/gpt-6-sol:        {input: 2.00, output: 10.00, cache_write: 2.50,   cache_read: 0.20}
openrouter/google/gemini-3.8-flash: {input: 0.75, output: 3.75,  cache_write: 0.0417, cache_read: 0.075}
openrouter/openai/gpt-6-luna:       {input: 0.10, output: 0.50,  cache_write: 0.125,  cache_read: 0.01}
